[project]
name = "rag-eval-lab"
version = "0.1.0"
description = "Small RAG lab: chunking, hybrid retrieval (pgvector + keyword, RRF), citations and retrieval evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "psycopg[binary]>=3.1", "pgvector>=0.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rag-eval = "rag_eval_lab.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
